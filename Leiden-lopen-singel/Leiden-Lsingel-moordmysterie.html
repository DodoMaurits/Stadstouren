<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leiden Singel Moordmysterie</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body class="spelpagina">
    <div class="container">
        <div class="intro-box">
            <h2>Grote Leidse Singelpark – Moordmysterie</h2>
            <p>Deze route kost €2,99.</p>
            <a class="nav-button" href="https://paymentlink.mollie.com/payment/XXXXXX">Betaal €2,99 en start de route</a>
        </div>
    </div>
    <script>
        (async function () {
            var secret = new URLSearchParams(location.hash.slice(1)).get('k');
            if (!secret) return;
            var hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(secret));
            var name = Array.from(new Uint8Array(hash)).map(function (b) {
                return b.toString(16).padStart(2, '0');
            }).join('').slice(0, 16) + '.html';
            var res = await fetch(name);
            if (res.ok) location.href = name;
        })();
    </script>
</body>
</html>
