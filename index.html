<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stadsroute Speurtocht</title>
    <link rel="stylesheet" href="style-index.css">
</head>
<body>
    <div class="container">

        <h1>Stadsroute Speurtocht</h1>
        <p></p>

        <div class="input-wrapper">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Selecteer een plaats..." 
                autocomplete="off"
            >
            <div id="dropdown" class="dropdown"></div>
        </div>

        <p id="errorMessage" class="error"></p>

        <div class="button-container">
            <button id="boatBtn" class="route-btn"><div class="running-man-svg">
            <svg viewBox="0 0 100 100" width="50" height="50">
                <!-- Lichaam -->
                <rect x="35" y="30" width="10" height="20" fill="#333" rx="5" />
                <!-- Hoofd -->
                <circle cx="40" cy="25" r="8" fill="#333" />
                <!-- Armen -->
                <rect x="25" y="32" width="10" height="4" fill="#333" rx="2" class="arm left-arm" />
                <rect x="45" y="32" width="10" height="4" fill="#333" rx="2" class="arm right-arm" />
                <!-- Benen -->
                <rect x="32" y="50" width="4" height="15" fill="#333" rx="2" class="leg left-leg" />
                <rect x="44" y="50" width="4" height="15" fill="#333" rx="2" class="leg right-leg" />
            </svg>
        </div>Vaarroutes</button>
            <button id="walkBtn" class="route-btn"><div class="running-man-icon"></div>Wandelroutes</button>
        </div>

    </div>

    <script src="script.js"></script>
    
</body>
</html>
