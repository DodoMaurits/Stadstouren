<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stadsroute Speurtocht</title>
    <link rel="stylesheet" href="style-index.css">
</head>
<body>
    <div class="container">
        <h1>Stadsroute Speurtocht</h1>

        <div class="city-selector">
            <div class="city-button" data-city="Leiden" data-boat="leiden-vaarroutes.html" data-walk="leiden-wandelroutes.html">
                Leiden
            </div>
            <p class="coming-soon">Binnenkort meer steden</p>
        </div>

        <p id="errorMessage" class="error"></p>

        <div class="button-container">
            <button id="boatBtn" class="route-btn">Vaarroutes</button>
            <button id="walkBtn" class="route-btn">Wandelroutes</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
